name: Actualizar histórico

on:
  schedule:
    # 21:40 UTC (18:40 en Argentina), después del cierre de Wall Street, de lunes a viernes
    - cron: "40 21 * * 1-5"
  push:
    branches: [main]
    paths:
      - data/portfolio.json
      - scripts/update_history.py
      - .github/workflows/history.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bajar cierres diarios
        run: python3 scripts/update_history.py

      - name: Guardar cambios
        run: |
          git add data/history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios en el histórico"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar histórico de precios"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
